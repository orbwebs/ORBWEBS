<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBWEBS // Spatial Mesh OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { black: '#05070a', cyan: '#00f0ff', blue: '#3b82f6', purple: '#8b5cf6', matrix: '#10b981' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #05070a; color: #e2e8f0; overflow-x: hidden; }
        .glass-panel {
            background: rgba(8, 12, 22, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }
        .neon-glow { text-shadow: 0 0 12px rgba(0, 240, 255, 0.6); }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- لایه‌های پس‌زمینه با pointer-events-none قطعی -->
    <canvas id="orb-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>
    <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900/10 via-cyber-black to-cyber-black pointer-events-none z-0"></div>

    <!-- هدر با z-index بالا -->
    <header class="fixed top-0 w-full z-50 border-b border-cyan-500/10 bg-cyber-black/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-cyan-400 rounded-full animate-ping"></div>
                <span class="font-mono text-xl font-black text-cyan-400 neon-glow">ORBWEBS</span>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="btnConnect" type="button" class="cursor-pointer font-mono text-xs border border-cyan-400 px-5 py-2.5 rounded bg-cyan-950/60 text-cyan-300 hover:bg-cyan-400 hover:text-black transition-all shadow-[0_0_15px_rgba(0,240,255,0.2)]">
                    اتصال کیف پول
                </button>
            </div>
        </div>
    </header>

    <!-- محتوای اصلی -->
    <main class="relative z-20 pt-36 pb-20 px-6 max-w-7xl mx-auto min-h-screen flex flex-col justify-center">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
            
            <div class="lg:col-span-7 space-y-6 text-right">
                <h1 class="text-4xl sm:text-6xl font-black text-white leading-tight">
                    بازتعریف ارتباطات وب در <br/>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 neon-glow">مش سه‌بعدی فضایی</span>
                </h1>
                <p class="text-slate-400 text-lg">پروتکل غیرمتمرکز، توکنومیک OWB و تعاملات نوین وب ۳.</p>
                
                <div class="flex flex-wrap gap-4 pt-4">
                    <button id="btnOpenModal" type="button" class="cursor-pointer px-8 py-4 rounded bg-cyan-400 text-black font-bold hover:bg-cyan-300 transition-all">
                        روایت پیدایش و ویدیو اختصاصی
                    </button>
                </div>
            </div>

            <!-- پنل تعاملی Web3 -->
            <div class="lg:col-span-5">
                <div class="glass-panel p-6 rounded-lg space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3 font-mono text-xs text-slate-400">
                        <span>ORB-TOKEN CONSOLE</span>
                        <span id="networkBadge" class="text-amber-400">بررسی شبکه...</span>
                    </div>

                    <div class="space-y-3 font-mono text-xs bg-slate-950/70 p-4 rounded border border-slate-800">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500">حساب متصل:</span>
                            <span id="accountDisplay" class="text-cyan-300">متصل نشده</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500">موجودی OWB:</span>
                            <span id="balanceDisplay" class="text-emerald-400 font-bold">---</span>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-900">
                            <span class="text-slate-500">آدرس توکن:</span>
                            <span class="text-purple-400">0x057e...8544</span>
                        </div>
                    </div>

                    <div class="space-y-3 pt-2 font-mono text-xs">
                        <div>
                            <label class="block text-slate-400 mb-1">آدرس مقصد:</label>
                            <input type="text" id="recipientInput" placeholder="0x..." class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-slate-100 focus:outline-none focus:border-cyan-400">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">مقدار (OWB):</label>
                            <input type="number" id="amountInput" placeholder="100" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-slate-100 focus:outline-none focus:border-cyan-400">
                        </div>
                        <button id="btnTransfer" type="button" class="cursor-pointer w-full py-3 bg-cyan-400 hover:bg-cyan-300 text-black font-bold rounded transition-all">
                            ارسال توکن OWB
                        </button>
                    </div>

                    <div id="txStatus" class="font-mono text-xs text-center text-slate-400 pt-2 min-h-[24px]"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- پنجره مودال -->
    <div id="genesisModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-xl hidden">
        <div class="glass-panel w-full max-w-2xl rounded-lg p-6 space-y-6 text-right">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <span class="text-cyan-400 font-mono text-sm">ARCHIVE // GENESIS</span>
                <button id="btnCloseModal" class="cursor-pointer text-slate-400 hover:text-white font-bold text-xl">✕</button>
            </div>
            <p class="text-slate-300 text-sm leading-relaxed">
                مستندات پیدایش پروتکل ORBWEBS و ساختار توکنومیک ۳۶۹ تریلیونی.
            </p>
            <div class="text-left">
                <button id="btnCloseModal2" class="cursor-pointer px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded font-mono text-xs">بستن</button>
            </div>
        </div>
    </div>

    <script>
        // Three.js Background
        const canvas = document.getElementById('orb-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const particleCount = 200;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / particleCount);
            const theta = Math.sqrt(particleCount * Math.PI) * phi;
            positions[i * 3] = 2.2 * Math.cos(theta) * Math.sin(phi);
            positions[i * 3 + 1] = 2.2 * Math.sin(theta) * Math.sin(phi);
            positions[i * 3 + 2] = 2.2 * Math.cos(phi);
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const spherePoints = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.035, transparent: true, opacity: 0.8 }));
        scene.add(spherePoints);
        camera.position.z = 4.5;

        function animate() {
            requestAnimationFrame(animate);
            spherePoints.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Event Listeners برای مودال
        const modal = document.getElementById('genesisModal');
        document.getElementById('btnOpenModal').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('btnCloseModal').addEventListener('click', () => modal.classList.add('hidden'));
        document.getElementById('btnCloseModal2').addEventListener('click', () => modal.classList.add('hidden'));

        // منطق Web3 و Ethers.js
        const CONTRACT_ADDRESS = "0x057ef64E23666F000b34aE31332854aCBd1c8544";
        const ERC20_ABI = [
            "function balanceOf(address account) view returns (uint256)",
            "function transfer(address recipient, uint256 amount) returns (boolean)"
        ];

        let provider, signer, tokenContract;

        async function initWeb3() {
            const statusEl = document.getElementById('txStatus');
            if (typeof window.ethereum === 'undefined') {
                statusEl.textContent = "خطا: افزونه MetaMask یافت نشد.";
                return;
            }

            try {
                statusEl.textContent = "درخواست تایید اتصال در MetaMask...";
                
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                const address = await signer.getAddress();
                const network = await provider.getNetwork();

                document.getElementById('networkBadge').textContent = `Chain ID: ${network.chainId}`;
                document.getElementById('accountDisplay').textContent = address.substring(0, 6) + "..." + address.substring(38);
                document.getElementById('btnConnect').textContent = "متصل شد ✓";

                tokenContract = new ethers.Contract(CONTRACT_ADDRESS, ERC20_ABI, signer);

                const balanceWei = await tokenContract.balanceOf(address);
                const balance = ethers.formatUnits(balanceWei, 18);
                document.getElementById('balanceDisplay').textContent = parseFloat(balance).toLocaleString() + " OWB";
                
                statusEl.textContent = "اتصال با موفقیت برقرار شد.";
                statusEl.className = "font-mono text-xs text-center text-emerald-400 pt-2";
            } catch (err) {
                console.error(err);
                statusEl.textContent = "خطا: " + (err.reason || err.message);
                statusEl.className = "font-mono text-xs text-center text-rose-400 pt-2";
            }
        }

        async function doTransfer() {
            const statusEl = document.getElementById('txStatus');
            const recipient = document.getElementById('recipientInput').value.trim();
            const amount = document.getElementById('amountInput').value.trim();

            if (!tokenContract) {
                statusEl.textContent = "ابتدا کیف پول را متصل کنید.";
                return;
            }
            if (!ethers.isAddress(recipient) || !amount || isNaN(amount) || Number(amount) <= 0) {
                statusEl.textContent = "آدرس مقصد یا مقدار نامعتبر است.";
                return;
            }

            try {
                statusEl.textContent = "در حال ارسال تراکنش...";
                const tx = await tokenContract.transfer(recipient, ethers.parseUnits(amount, 18));
                statusEl.textContent = "تراکنش ثبت شد، منتظر تایید شبکه...";
                await tx.wait();
                statusEl.textContent = "انتقال با موفقیت انجام شد!";
                statusEl.className = "font-mono text-xs text-center text-emerald-400 pt-2";
            } catch (err) {
                console.error(err);
                statusEl.textContent = "خطا در تراکنش: " + (err.reason || err.message);
                statusEl.className = "font-mono text-xs text-center text-rose-400 pt-2";
            }
        }

        // اتصال رویدادهای کلیک به صورت صریح (Event Binding)
        document.getElementById('btnConnect').addEventListener('click', initWeb3);
        document.getElementById('btnTransfer').addEventListener('click', doTransfer);
    </script>
</body>
</html>
