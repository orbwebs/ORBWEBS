<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBWEBS // Autonomous Spatial Mesh</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #00f0ff; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* HUD Overlay */
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: grid; grid-template-rows: 80px 1fr 60px; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; border-bottom: 1px solid rgba(0, 240, 255, 0.2); padding-bottom: 10px; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 4px; background: linear-gradient(90deg, #9d4edd, #00f0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .status-badge { font-size: 11px; border: 1px solid #00f0ff; padding: 4px 12px; border-radius: 20px; background: rgba(0,240,255,0.05); box-shadow: 0 0 10px rgba(0,240,255,0.2); }
        
        /* Central Core Panel */
        .core-hub { display: flex; justify-content: center; align-items: center; pointer-events: none; }
        .holo-card { pointer-events: auto; background: rgba(5, 5, 15, 0.75); border: 1px solid rgba(0, 240, 255, 0.4); padding: 30px; border-radius: 12px; backdrop-filter: blur(12px); box-shadow: 0 0 30px rgba(157, 78, 221, 0.2); max-width: 450px; text-align: center; }
        .holo-card h2 { font-size: 18px; margin-bottom: 15px; letter-spacing: 2px; color: #fff; }
        .holo-card p { font-size: 13px; color: #8ab4f8; margin-bottom: 20px; line-height: 1.6; }
        .btn-matrix { background: transparent; border: 1px solid #00f0ff; color: #00f0ff; padding: 10px 24px; font-family: inherit; font-size: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; border-radius: 4px; }
        .btn-matrix:hover { background: #00f0ff; color: #000; box-shadow: 0 0 20px #00f0ff; }
        
        /* Footer Telemetry */
        footer { display: flex; justify-content: space-between; align-items: flex-end; font-size: 11px; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud-overlay">
        <header>
            <div class="logo">Orbwebs</div>
            <div class="status-badge">SYSTEM: ACTIVE // MESH 10-LAYER</div>
        </header>

        <div class="core-hub">
            <div class="holo-card">
                <h2>SPATIAL NEURAL CORE</h2>
                <p>Autonomous AI-native sovereign infrastructure. Zero-copy hardware licensing & decentralized multi-layered spatial production mesh.</p>
                <button class="btn-matrix" onclick="activateCore()">Initialize Protocol</button>
            </div>
        </div>

        <footer>
            <div>LAT: 35.6892° N, LON: 51.3890° E</div>
            <div>SECURE RING: TIER-1 ACTIVE</div>
        </footer>
    </div>

    <!-- Three.js for 3D Globe & Spatial Mesh Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Create Globe & Spiderweb Sphere
        const sphereGeometry = new THREE.SphereGeometry(3, 32, 32);
        const sphereMaterial = new THREE.MeshBasicMaterial({
            color: 0x050b1a,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });
        const globe = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(globe);

        // Create Neural Node Particles
        const particlesCount = 1500;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesPositions = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            particlesPositions[i] = (Math.random() - 0.5) * 12;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.04,
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.8
        });
        const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleSystem);

        camera.position.z = 7;

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            globe.rotation.y += 0.001;
            particleSystem.rotation.y -= 0.0005;
            renderer.render(scene, camera);
        }
        animate();

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function activateCore() {
            alert("ORBWEBS Sovereign Protocol Synchronized.");
        }
    </script>
</body>
</html>
