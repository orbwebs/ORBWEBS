<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORBWEBS — Cybernetic Portal</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #0d121d;
      --border: #1a2333;
      --accent: #00f0ff;
      --accent-dim: rgba(0, 240, 255, 0.12);
      --text: #e2e8f0;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
    }
    .badge {
      font-size: 11px;
      background: var(--accent-dim);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      text-transform: uppercase;
      font-family: monospace;
    }
    .section {
      background: #090d15;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .val {
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
      color: #cbd5e1;
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .balance-val {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      font-family: monospace;
    }
    input {
      width: 100%;
      background: #06080c;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .btn-group { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: #1e293b; color: #fff; border: 1px solid var(--border); }
    .btn-secondary:hover { background: #334155; }
    .status {
      margin-top: 16px;
      font-size: 12px;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      background: #06080c;
      border: 1px solid var(--border);
      min-height: 38px;
      display: flex;
      align-items: center;
      word-break: break-all;
    }
    .status.ok { color: var(--success); border-color: var(--success); }
    .status.bad { color: var(--danger); border-color: var(--danger); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>ORBWEBS</h1>
    <span class="badge">Base Sepolia (84532)</span>
  </div>

  <div class="section">
    <div class="label">MetaMask Account</div>
    <div id="addr" class="val">Not connected</div>
    <div style="margin-top: 10px; display: flex; gap: 8px;">
      <button id="btnConnect" class="btn-primary">Connect Wallet</button>
      <button id="btnSwitch" class="btn-secondary">Switch Network</button>
    </div>
  </div>

  <div class="section">
    <div class="balance-box">
      <div>
        <div class="label">OWB Balance</div>
        <div id="bal" class="balance-val">0.00 <span style="font-size: 13px;">OWB</span></div>
      </div>
      <button id="btnRefresh" class="btn-secondary" style="flex: 0; padding: 6px 12px; font-size: 12px;">Refresh</button>
    </div>
  </div>

  <div class="section">
    <div class="label">Transfer OWB Token</div>
    <input id="toAddr" type="text" placeholder="Recipient address (0x...)" spellcheck="false" />
    <input id="toAmount" type="text" placeholder="Amount (e.g. 10.5)" />
    <button id="btnTransfer" class="btn-primary" style="width: 100%;">Transfer via MetaMask</button>
  </div>

  <div class="label">Token Contract</div>
  <div class="val" style="font-size: 11px; margin-bottom: 8px;">0x60b21A54F54Ce9b2fC0D213cCC2dFD35562f7854</div>

  <div id="statusBox" class="status">System idle. Connect wallet to start.</div>
</div>

<script type="module">
  import { createThirdwebClient, getContract, readContract, prepareContractCall, sendTransaction } from "https://esm.sh/thirdweb@5";
  import { createWallet } from "https://esm.sh/thirdweb@5/wallets";
  import { defineChain } from "https://esm.sh/thirdweb@5/chains";

  // Production Parameters
  const CLIENT_ID = "76a1ef6f39d9d36b3f63a69fd6d8b708";
  const CONTRACT_ADDR = "0x60b21A54F54Ce9b2fC0D213cCC2dFD35562f7854";
  const CHAIN_ID = 84532;

  const chain = defineChain({
    id: CHAIN_ID,
    rpcUrls: { default: { http: ["https://sepolia.base.org"] } }
  });

  const client = createThirdwebClient({ clientId: CLIENT_ID });
  const wallet = createWallet("io.metamask");

  const contract = getContract({
    client,
    chain,
    address: CONTRACT_ADDR,
    abi: [
      { type: "function", name: "decimals", stateMutability: "view", inputs: [], outputs: [{ type: "uint8" }] },
      { type: "function", name: "balanceOf", stateMutability: "view", inputs: [{ name: "account", type: "address" }], outputs: [{ type: "uint256" }] },
      { type: "function", name: "transfer", stateMutability: "nonpayable", inputs: [{ name: "recipient", type: "address" }, { name: "amount", type: "uint256" }], outputs: [{ type: "bool" }] }
    ]
  });

  let account = null;

  const setStatus = (msg, type = "") => {
    const box = document.getElementById("statusBox");
    box.className = "status " + type;
    box.textContent = msg;
  };

  // Safe BigInt formatting
  function formatBigIntUnits(value, decimals) {
    const s = value.toString().padStart(decimals + 1, "0");
    const head = s.slice(0, -decimals);
    const tail = s.slice(-decimals).replace(/0+$/, "");
    return tail ? `${head}.${tail}` : head;
  }

  // Safe BigInt parsing
  function parseBigIntUnits(amountStr, decimals) {
    const clean = amountStr.trim();
    if (!/^\d+(\.\d+)?$/.test(clean)) throw new Error("Invalid amount numeric format.");
    const [whole, fraction = ""] = clean.split(".");
    if (fraction.length > decimals) throw new Error(`Precision exceeds token decimals (${decimals}).`);
    const full = whole + fraction.padEnd(decimals, "0");
    return BigInt(full);
  }

  async function connect() {
    try {
      setStatus("Initializing MetaMask handshake...");
      account = await wallet.connect({ client });
      document.getElementById("addr").textContent = account.address;
      setStatus("Wallet connected successfully.", "ok");
      await updateBalance();
    } catch (err) {
      setStatus("Connection error: " + (err.message || err), "bad");
    }
  }

  async function switchNetwork() {
    try {
      setStatus("Requesting network switch to Base Sepolia...");
      const provider = await wallet.getProvider();
      await provider.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x" + CHAIN_ID.toString(16) }]
      });
      setStatus("Active network verified: Base Sepolia.", "ok");
    } catch (err) {
      // Chain not added to metamask
      if (err?.code === 4902) {
        try {
          const provider = await wallet.getProvider();
          await provider.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: "0x" + CHAIN_ID.toString(16),
              chainName: "Base Sepolia",
              nativeCurrency: { name: "ETH", symbol: "ETH", decimals: 18 },
              rpcUrls: ["https://sepolia.base.org"],
              blockExplorerUrls: ["https://sepolia.basescan.org"]
            }]
          });
          setStatus("Base Sepolia added and switched.", "ok");
        } catch (addErr) {
          setStatus("Failed adding chain: " + (addErr.message || addErr), "bad");
        }
      } else {
        setStatus("Network switch error: " + (err.message || err), "bad");
      }
    }
  }

  async function updateBalance() {
    if (!account) return setStatus("Connect wallet to read balance.", "bad");
    try {
      setStatus("Querying node for OWB balance...");
      const decimals = await readContract({ contract, method: "decimals", params: [] });
      const rawBal = await readContract({ contract, method: "balanceOf", params: [account.address] });

      const balFormatted = formatBigIntUnits(rawBal, Number(decimals));
      document.getElementById("bal").innerHTML = `${balFormatted} <span style="font-size: 13px;">OWB</span>`;
      setStatus("State synced.", "ok");
    } catch (err) {
      setStatus("Contract read failure: " + (err.message || err), "bad");
    }
  }

  async function executeTransfer() {
    if (!account) return setStatus("Action rejected: Wallet not connected.", "bad");
    const to = document.getElementById("toAddr").value.trim();
    const amountStr = document.getElementById("toAmount").value.trim();

    if (!/^0x[a-fA-F0-9]{40}$/.test(to)) return setStatus("Validation error: Invalid Ethereum address format.", "bad");

    try {
      const decimals = await readContract({ contract, method: "decimals", params: [] });
      const amountBigInt = parseBigIntUnits(amountStr, Number(decimals));

      if (amountBigInt <= 0n) return setStatus("Amount must be greater than zero.", "bad");

      setStatus("Encoding contract transaction call...");
      const tx = prepareContractCall({
        contract,
        method: "transfer",
        params: [to, amountBigInt]
      });

      setStatus("Prompt sent: Awaiting user signature in MetaMask...");
      const res = await sendTransaction({ transaction: tx, account });
      setStatus("Tx Broadcasted! Hash: " + res.transactionHash, "ok");
      
      document.getElementById("toAddr").value = "";
      document.getElementById("toAmount").value = "";
      await updateBalance();
    } catch (err) {
      setStatus("Transaction aborted: " + (err.message || err), "bad");
    }
  }

  document.getElementById("btnConnect").addEventListener("click", connect);
  document.getElementById("btnSwitch").addEventListener("click", switchNetwork);
  document.getElementById("btnRefresh").addEventListener("click", updateBalance);
  document.getElementById("btnTransfer").addEventListener("click", executeTransfer);
</script>

</body>
</html>
